<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Botella UAI – Realidad Aumentada</title>

  <!-- A-Frame 1.3.0 (versión compatible con AR.js 3.4.x NFT) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <!-- AR.js con soporte de marcadores NFT (Natural Feature Tracking) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    .overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); color: #fff; text-align: center; padding: 16px;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #555; border-top-color: #fff;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9;
      background: rgba(0,0,0,.6); color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 14px; pointer-events: none; transition: opacity .3s;
    }
    #hint.hidden { opacity: 0; }
    #marker-link {
      position: fixed; top: 12px; right: 12px; z-index: 9;
      background: rgba(0,0,0,.6); color: #fff; padding: 8px 12px; border-radius: 8px;
      font-size: 14px; text-decoration: none;
    }
  </style>
</head>

<body>
  <div id="loader" class="overlay">
    <div class="spinner"></div>
    <div id="loader-text">Cargando marcador y modelo 3D…</div>
  </div>
  <div id="hint">Apunta la cámara a la imagen del marcador</div>
  <a id="marker-link" href="assets/marcador.png" target="_blank" rel="noopener">Ver marcador</a>

  <script>
    // Parámetros ajustables por URL, ej: index.html?altura=300&debug=1
    const params = new URLSearchParams(location.search);
    window.AR_CFG = {
      // Tamaño del marcador en unidades NFT (mm): 1920x1080 px a 59.712 dpi
      markerW: 1920 / 59.712 * 25.4,   // ≈ 816.7
      markerH: 1080 / 59.712 * 25.4,   // ≈ 459.4
      // Altura deseada del modelo, en las mismas unidades (mm)
      altura: parseFloat(params.get('altura')) || 380,
      debug: params.has('debug'),
    };

    // Ajusta el GLB automáticamente: lo escala a la altura deseada,
    // lo centra en X/Z y apoya su base en Y=0.
    AFRAME.registerComponent('auto-fit', {
      schema: { height: { type: 'number', default: 380 } },
      init() {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          // Las luces incluidas en el GLB (KeyShot) suelen sobreexponer: se quitan
          const lights = [];
          obj.traverse(o => { if (o.isLight) lights.push(o); });
          lights.forEach(l => l.parent.remove(l));

          const box = new THREE.Box3().setFromObject(obj);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const s = this.data.height / (size.y || 1);
          obj.scale.multiplyScalar(s);
          obj.position.set(-center.x * s, -box.min.y * s, -center.z * s);

          document.getElementById('loader').style.display = 'none';
        });
        this.el.addEventListener('model-error', () => {
          document.getElementById('loader-text').textContent = 'Error al cargar el modelo 3D.';
        });
      }
    });

    // Muestra/oculta el aviso según si el marcador está a la vista
    AFRAME.registerComponent('marker-events', {
      init() {
        const hint = document.getElementById('hint');
        this.el.addEventListener('markerFound', () => hint.classList.add('hidden'));
        this.el.addEventListener('markerLost', () => hint.classList.remove('hidden'));
      }
    });

    // Coloca el contenido en el centro del marcador (el origen NFT es la esquina inferior izquierda)
    AFRAME.registerComponent('nft-center', {
      init() {
        const c = window.AR_CFG;
        this.el.setAttribute('position', `${c.markerW / 2} 0 ${-c.markerH / 2}`);
        this.el.querySelector('[gltf-model]').setAttribute('auto-fit', 'height', c.altura);
        if (c.debug) {
          const plane = document.createElement('a-plane');
          plane.setAttribute('width', c.markerW);
          plane.setAttribute('height', c.markerH);
          plane.setAttribute('rotation', '-90 0 0');
          plane.setAttribute('material', 'color: #00aaff; opacity: 0.35; transparent: true; side: double');
          this.el.appendChild(plane);
        }
      }
    });

    window.addEventListener('arjs-nft-loaded', () => {
      document.getElementById('loader-text').textContent = 'Marcador listo. Cargando modelo 3D…';
    });
  </script>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">

    <a-assets timeout="60000">
      <a-asset-item id="botella" src="assets/models/botella.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 2" position="1 2 1"></a-entity>

    <!-- Marcador NFT: url SIN extensión (AR.js agrega .fset, .fset3 e .iset) -->
    <a-nft
      type="nft"
      url="assets/nft/botella"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
      marker-events>
      <a-entity nft-center>
        <a-entity gltf-model="#botella" auto-fit></a-entity>
      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
