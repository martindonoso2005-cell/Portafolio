<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Martín - Retro Arcade</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #181425;          /* Púrpura noche arcade */
      --surface: #262b44;     /* Azul profundo UI */
      --card-bg: #3a4466;     /* Gris azulado paneles */
      --border-dark: #000000; /* Delineado negro puro píxel */
      --text-main: #f4f4f4;   /* Blanco tiza */
      --text-muted: #8b9bb4;  /* Gris retro legible */
      --accent: #ffcc00;      /* Amarillo arcade / Monedas */
      --accent-hover: #ffae00;/* Ámbar */
      --accent-cyan: #00f0ff; /* Cian retro */
      --danger: #ff0055;      /* Rojo arcade */
      --pixel-shadow: 4px 4px 0px #000000;
      --pixel-shadow-lg: 6px 6px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.8;
      padding: 0 1.5rem 5rem;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Header Centrado */
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 0 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 4px dashed var(--border-dark);
      position: relative;
    }

    .header-info h1 {
      font-size: 1.8rem;
      letter-spacing: -0.05em;
      color: var(--accent);
      text-shadow: 3px 3px 0px #000;
      margin-bottom: 0.8rem;
    }

    .header-info p {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 1.5rem;
    }

    .admin-toggle-btn {
      font-family: inherit;
      background: var(--surface);
      border: 3px solid var(--border-dark);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      font-size: 0.65rem;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      transition: none;
    }

    .admin-toggle-btn:hover {
      background: var(--accent);
      color: #000;
      transform: translate(-2px, -2px);
      box-shadow: var(--pixel-shadow-lg);
    }

    .admin-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* Panel Admin */
    .admin-panel {
      max-width: 1100px;
      margin: 2rem auto;
      background: var(--surface);
      border: 4px solid var(--border-dark);
      padding: 1.5rem;
      box-shadow: var(--pixel-shadow);
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-panel h2 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 0px #000;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.6rem;
      color: var(--accent-cyan);
    }

    .form-group input, 
    .form-group textarea {
      font-family: inherit;
      padding: 0.6rem;
      background: #10121c;
      color: #fff;
      border: 3px solid var(--border-dark);
      font-size: 0.7rem;
      outline: none;
      box-shadow: inset 2px 2px 0px #000;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      background: #1a1e30;
      border-color: var(--accent-cyan);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 50px;
    }

    .admin-form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      align-items: center;
    }

    .btn-submit {
      font-family: inherit;
      background: var(--accent);
      color: #000;
      border: 3px solid var(--border-dark);
      padding: 0.8rem 1.2rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--pixel-shadow-lg);
    }

    .btn-submit:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-cancel {
      font-family: inherit;
      background: #444;
      color: #fff;
      border: 3px solid var(--border-dark);
      padding: 0.8rem 1.2rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      display: none;
    }

    .btn-cancel:hover {
      background: #666;
    }

    /* Galería de Proyectos */
    main {
      max-width: 1100px;
      margin: 3rem auto 0;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    .project-window {
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      box-shadow: var(--pixel-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .project-window:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--pixel-shadow-lg);
    }

    .window-header {
      background: var(--surface);
      border-bottom: 4px solid var(--border-dark);
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border: 1px solid var(--border-dark);
    }
    .dot.red { background: var(--danger); }
    .dot.yellow { background: var(--accent); }
    .dot.green { background: #38b764; }

    .window-title {
      font-size: 0.55rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .project-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .image-container {
      width: 100%;
      height: 180px;
      background: #0f1017;
      border-bottom: 4px solid var(--border-dark);
      position: relative;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 0.75rem;
    }

    .project-body h3 {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-body h3::after {
      content: "►";
      font-size: 0.7rem;
      color: var(--accent);
    }

    .project-body p {
      font-size: 0.6rem;
      line-height: 1.6;
      color: var(--text-muted);
      flex-grow: 1;
    }

    .tag-badge {
      display: inline-block;
      align-self: flex-start;
      background: #181425;
      color: var(--accent-cyan);
      border: 2px solid var(--border-dark);
      font-size: 0.55rem;
      padding: 0.35rem 0.6rem;
      box-shadow: 2px 2px 0px #000;
    }

    /* Barra de herramientas Admin por Tarjeta */
    .card-admin-toolbar {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 10;
      gap: 4px;
    }

    .admin-mode .card-admin-toolbar {
      display: flex;
    }

    .tool-btn {
      font-family: inherit;
      font-size: 0.5rem;
      padding: 3px 5px;
      cursor: pointer;
      border: 2px solid var(--border-dark);
      box-shadow: 2px 2px 0px #000;
      color: #fff;
    }

    .tool-btn.btn-del { background: var(--danger); }
    .tool-btn.btn-del:hover { background: #ff3377; }
    
    .tool-btn.btn-edit { background: var(--accent-cyan); color: #000; }
    .tool-btn.btn-edit:hover { background: #55f5ff; }

    .tool-btn.btn-move { background: var(--surface); color: var(--accent); }
    .tool-btn.btn-move:hover { background: #3a4466; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      border: 4px dashed var(--border-dark);
      background: var(--surface);
      font-size: 0.7rem;
      line-height: 2;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>PORTAFOLIO MARTÍN</h1>
      <p>★ EXPLORA MIS PROYECTOS Y APLICACIONES ★</p>
    </div>
    <button class="admin-toggle-btn" id="adminToggle" title="Atajo: Alt + A">[⚙] MODO GESTOR</button>
  </header>

  <section class="admin-panel" id="adminPanel">
    <h2 id="formTitle">[+] AÑADIR NUEVO CARTUCHO</h2>
    <form class="admin-form" id="projectForm">
      <input type="hidden" id="editingId" value="">

      <div class="form-group">
        <label for="pTitle">Título del Proyecto</label>
        <input type="text" id="pTitle" placeholder="Ej. Sonificador Espectral" required>
      </div>

      <div class="form-group">
        <label for="pLink">URL del Proyecto</label>
        <input type="url" id="pLink" placeholder="https://mi-proyecto.app" required>
      </div>

      <div class="form-group">
        <label for="pImg">URL de la Captura</label>
        <input type="url" id="pImg" placeholder="https://images.unsplash.com/..." required>
      </div>

      <div class="form-group">
        <label for="pTag">Categoría / ROM</label>
        <input type="text" id="pTag" placeholder="Ej. Web Audio, Juego">
      </div>

      <div class="form-group" style="grid-column: 1 / -1;">
        <label for="pDesc">Descripción Corta</label>
        <textarea id="pDesc" placeholder="Breve historia del proyecto..."></textarea>
      </div>

      <div class="admin-form-actions">
        <button type="button" class="btn-cancel" id="cancelEditBtn" onclick="resetFormState()">CANCELAR EDICIÓN</button>
        <button type="submit" class="btn-submit" id="submitBtn">GUARDAR CARTUCHO</button>
      </div>
    </form>
  </section>

  <main>
    <div class="projects-grid" id="projectsContainer"></div>
  </main>

  <script>
    // PROYECTOS PÚBLICOS: esta lista es lo único que ven los visitantes.
    // Lo que se agrega con el MODO GESTOR queda solo en tu navegador.
    const DEFAULT_PROJECTS = [
      {
        id: 7,
        title: "Robot Face",
        url: "https://portafolio.insta3d.cl/universidad/robotface.html",
        img: "img/robotface.jpg",
        desc: "Cabeza robótica con ojos animatrónicos impresos en 3D, caja de corte láser y Arduino. Sigue rostros con la cámara y conversa por voz.",
        tag: "Robótica"
      },
      {
        id: 1,
        title: "Arcade Game",
        url: "https://martindonoso2005-cell.github.io/juego/",
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80",
        desc: "Juego retro interactivo desarrollado en entorno web.",
        tag: "Game Dev"
      },
      {
        id: 2,
        title: "Adivinar Sonido",
        url: "https://martindonoso2005-cell.github.io/Juego-Adivinar-Sonido/",
        img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80",
        desc: "Desafío auditivo interactivo para ejercitar el oído y reconocer pistas de audio.",
        tag: "Audio Game"
      },
      {
        id: 3,
        title: "Sonificador de Datos",
        url: "https://martindonoso2005-cell.github.io/Sonficador-de-datos/",
        img: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=800&q=80",
        desc: "Transformador de secuencias de datos cuantitativos a espectros audibles.",
        tag: "Data Science"
      },
      {
        id: 4,
        title: "Sintetizador Web",
        url: "https://martindonoso2005-cell.github.io/sintetizador/",
        img: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=800&q=80",
        desc: "Instrumento musical digital con modulación de ondas y frecuencias en tiempo real.",
        tag: "Web Audio"
      },
      {
        id: 5,
        title: "Interfaz Electrodoméstico",
        url: "https://martindonoso2005-cell.github.io/Interfaz-electrodomestico/",
        img: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80",
        desc: "Diseño y simulación de interfaz de usuario digital para sistemas del hogar.",
        tag: "UI/UX"
      },
      {
        id: 6,
        title: "Sonificador 2.0",
        url: "https://martindonoso2005-cell.github.io/Sonificador-2.0/",
        img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=800&q=80",
        desc: "Evolución del motor de sonificación con parámetros sonoros avanzados y filtros.",
        tag: "DSP Audio"
      }
    ];

    let projects = JSON.parse(localStorage.getItem('martin_portfolio_projects_v2')) || DEFAULT_PROJECTS;
    // Si el navegador tiene una lista guardada antigua, suma los proyectos nuevos de la lista pública.
    DEFAULT_PROJECTS.forEach(d => {
      if (!projects.some(p => p.id === d.id)) projects.unshift(d);
    });

    const projectsContainer = document.getElementById('projectsContainer');
    const adminToggle = document.getElementById('adminToggle');
    const adminPanel = document.getElementById('adminPanel');
    const projectForm = document.getElementById('projectForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const editingId = document.getElementById('editingId');

    let isAdmin = false;

    function saveState() {
      localStorage.setItem('martin_portfolio_projects_v2', JSON.stringify(projects));
    }

    function renderProjects() {
      projectsContainer.innerHTML = '';

      if (projects.length === 0) {
        projectsContainer.innerHTML = `
          <div class="empty-state">
            <p>NO HAY PROYECTOS INSERTADOS.</p>
            <small>ABRE EL GESTOR PARA INSERTAR UN CARTUCHO.</small>
          </div>
        `;
        return;
      }

      projects.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'project-window';
        
        card.innerHTML = `
          <div class="window-header">
            <div class="window-dots">
              <div class="dot red"></div>
              <div class="dot yellow"></div>
              <div class="dot green"></div>
            </div>
            <span class="window-title">ROM [0${index + 1}]</span>
          </div>

          <div class="card-admin-toolbar">
            <button class="tool-btn btn-move" title="Mover a la izquierda" onclick="moveProject(${index}, -1)">◀</button>
            <button class="tool-btn btn-move" title="Mover a la derecha" onclick="moveProject(${index}, 1)">▶</button>
            <button class="tool-btn btn-edit" title="Editar proyecto" onclick="editProject(${p.id})">EDITAR</button>
            <button class="tool-btn btn-del" title="Eliminar proyecto" onclick="deleteProject(${p.id})">BORRAR</button>
          </div>

          <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="project-link">
            <div class="image-container">
              <img src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400/181425/ffcc00?text=NO+SIGNAL'">
            </div>
            <div class="project-body">
              <h3>${p.title}</h3>
              <p>${p.desc || 'Presiona botón para explorar el sistema.'}</p>
              ${p.tag ? `<span class="tag-badge">[${p.tag}]</span>` : ''}
            </div>
          </a>
        `;

        projectsContainer.appendChild(card);
      });
    }

    function toggleAdmin() {
      isAdmin = !isAdmin;
      adminPanel.classList.toggle('active', isAdmin);
      document.body.classList.toggle('admin-mode', isAdmin);
      adminToggle.textContent = isAdmin ? '[✕] CERRAR' : '[⚙] MODO GESTOR';
      if (!isAdmin) resetFormState();
    }

    adminToggle.addEventListener('click', toggleAdmin);

    window.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === 'a' || e.key === 'A')) {
        toggleAdmin();
      }
    });

    // Guardar (Nuevo o Editado)
    projectForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const currentId = editingId.value;
      const projectData = {
        title: document.getElementById('pTitle').value.trim(),
        url: document.getElementById('pLink').value.trim(),
        img: document.getElementById('pImg').value.trim(),
        tag: document.getElementById('pTag').value.trim(),
        desc: document.getElementById('pDesc').value.trim()
      };

      if (currentId) {
        // Actualizar proyecto existente
        const targetIndex = projects.findIndex(p => p.id == currentId);
        if (targetIndex !== -1) {
          projects[targetIndex] = { ...projects[targetIndex], ...projectData };
        }
      } else {
        // Añadir nuevo cartucho al inicio
        projects.unshift({
          id: Date.now(),
          ...projectData
        });
      }

      saveState();
      renderProjects();
      resetFormState();
    });

    // Iniciar edición de proyecto
    window.editProject = function(id) {
      const p = projects.find(item => item.id === id);
      if (!p) return;

      editingId.value = p.id;
      document.getElementById('pTitle').value = p.title;
      document.getElementById('pLink').value = p.url;
      document.getElementById('pImg').value = p.img;
      document.getElementById('pTag').value = p.tag || '';
      document.getElementById('pDesc').value = p.desc || '';

      formTitle.textContent = `[✎] EDITANDO: ${p.title.toUpperCase()}`;
      submitBtn.textContent = 'ACTUALIZAR CARTUCHO';
      cancelEditBtn.style.display = 'inline-block';

      if (!isAdmin) toggleAdmin();
      adminPanel.scrollIntoView({ behavior: 'smooth' });
    };

    window.resetFormState = function() {
      projectForm.reset();
      editingId.value = '';
      formTitle.textContent = '[+] AÑADIR NUEVO CARTUCHO';
      submitBtn.textContent = 'GUARDAR CARTUCHO';
      cancelEditBtn.style.display = 'none';
    };

    // Reordenar tarjetas
    window.moveProject = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= projects.length) return;

      const item = projects.splice(index, 1)[0];
      projects.splice(targetIndex, 0, item);

      saveState();
      renderProjects();
    };

    // Borrar proyecto
    window.deleteProject = function(id) {
      if (confirm('¿BORRAR ESTE CARTUCHO DEL SISTEMA?')) {
        projects = projects.filter(p => p.id !== id);
        saveState();
        renderProjects();
        if (editingId.value == id) resetFormState();
      }
    };

    renderProjects();
  </script>
</body>
</html>
