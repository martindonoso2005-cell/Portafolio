<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Martín - Retro Arcade</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #181425;          /* Púrpura noche arcade */
      --surface: #262b44;     /* Azul profundo UI */
      --card-bg: #3a4466;     /* Gris azulado paneles */
      --border-dark: #000000; /* Delineado negro puro píxel */
      --text-main: #f4f4f4;   /* Blanco tiza */
      --text-muted: #8b9bb4;  /* Gris retro legible */
      --accent: #ffcc00;      /* Amarillo arcade / Monedas */
      --accent-hover: #ffae00;/* Ámbar */
      --accent-cyan: #00f0ff; /* Cian retro */
      --danger: #ff0055;      /* Rojo arcade */
      --pixel-shadow: 4px 4px 0px #000000;
      --pixel-shadow-lg: 6px 6px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.8;
      padding: 0 1.5rem 5rem;
      /* Efecto sutil de fondo CRT/píxel */
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Header Centrado */
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 0 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 4px dashed var(--border-dark);
      position: relative;
    }

    .header-info h1 {
      font-size: 1.8rem;
      letter-spacing: -0.05em;
      color: var(--accent);
      text-shadow: 3px 3px 0px #000;
      margin-bottom: 0.8rem;
    }

    .header-info p {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 1.5rem;
    }

    .admin-toggle-btn {
      font-family: inherit;
      background: var(--surface);
      border: 3px solid var(--border-dark);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      font-size: 0.65rem;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      transition: none;
    }

    .admin-toggle-btn:hover {
      background: var(--accent);
      color: #000;
      transform: translate(-2px, -2px);
      box-shadow: var(--pixel-shadow-lg);
    }

    .admin-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* Panel Admin Estilo Consola/Inventario */
    .admin-panel {
      max-width: 1100px;
      margin: 2rem auto;
      background: var(--surface);
      border: 4px solid var(--border-dark);
      padding: 1.5rem;
      box-shadow: var(--pixel-shadow);
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-panel h2 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 0px #000;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.6rem;
      color: var(--accent-cyan);
    }

    .form-group input, 
    .form-group textarea {
      font-family: inherit;
      padding: 0.6rem;
      background: #10121c;
      color: #fff;
      border: 3px solid var(--border-dark);
      font-size: 0.7rem;
      outline: none;
      box-shadow: inset 2px 2px 0px #000;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      background: #1a1e30;
      border-color: var(--accent-cyan);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 50px;
    }

    .btn-submit {
      font-family: inherit;
      grid-column: 1 / -1;
      background: var(--accent);
      color: #000;
      border: 3px solid var(--border-dark);
      padding: 0.8rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      justify-self: end;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--pixel-shadow-lg);
    }

    .btn-submit:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* Galería de Proyectos / Cajas de Juego */
    main {
      max-width: 1100px;
      margin: 3rem auto 0;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    .project-window {
      background: var(--card-bg);
      border: 4px solid var(--border-dark);
      box-shadow: var(--pixel-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .project-window:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--pixel-shadow-lg);
    }

    /* Ventana tipo Retro OS */
    .window-header {
      background: var(--surface);
      border-bottom: 4px solid var(--border-dark);
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border: 1px solid var(--border-dark);
    }
    .dot.red { background: var(--danger); }
    .dot.yellow { background: var(--accent); }
    .dot.green { background: #38b764; }

    .window-title {
      font-size: 0.55rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .project-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .image-container {
      width: 100%;
      height: 180px;
      background: #0f1017;
      border-bottom: 4px solid var(--border-dark);
      position: relative;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 0.75rem;
    }

    .project-body h3 {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-body h3::after {
      content: "►";
      font-size: 0.7rem;
      color: var(--accent);
    }

    .project-body p {
      font-size: 0.6rem;
      line-height: 1.6;
      color: var(--text-muted);
      flex-grow: 1;
    }

    .tag-badge {
      display: inline-block;
      align-self: flex-start;
      background: #181425;
      color: var(--accent-cyan);
      border: 2px solid var(--border-dark);
      font-size: 0.55rem;
      padding: 0.35rem 0.6rem;
      box-shadow: 2px 2px 0px #000;
    }

    /* Botón Eliminar en Modo Gestor */
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--danger);
      color: white;
      border: 2px solid var(--border-dark);
      font-family: inherit;
      font-size: 0.55rem;
      padding: 3px 6px;
      cursor: pointer;
      display: none;
      z-index: 10;
      box-shadow: 2px 2px 0px #000;
    }

    .delete-btn:hover {
      background: #ff3377;
    }

    .admin-mode .delete-btn {
      display: block;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      border: 4px dashed var(--border-dark);
      background: var(--surface);
      font-size: 0.7rem;
      line-height: 2;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>PORTAFOLIO MARTÍN</h1>
      <p>★ EXPLORA MIS PROYECTOS Y APLICACIONES ★</p>
    </div>
    <button class="admin-toggle-btn" id="adminToggle" title="Atajo: Alt + A">[⚙] MODO GESTOR</button>
  </header>

  <section class="admin-panel" id="adminPanel">
    <h2>[+] AÑADIR NUEVO CARTUCHO</h2>
    <form class="admin-form" id="projectForm">
      <div class="form-group">
        <label for="pTitle">Título del Proyecto</label>
        <input type="text" id="pTitle" placeholder="Ej. Sonificador Espectral" required>
      </div>

      <div class="form-group">
        <label for="pLink">URL del Proyecto</label>
        <input type="url" id="pLink" placeholder="https://mi-proyecto.app" required>
      </div>

      <div class="form-group">
        <label for="pImg">URL de la Captura</label>
        <input type="url" id="pImg" placeholder="https://images.unsplash.com/..." required>
      </div>

      <div class="form-group">
        <label for="pTag">Categoría / ROM</label>
        <input type="text" id="pTag" placeholder="Ej. Web Audio, IA">
      </div>

      <div class="form-group" style="grid-column: 1 / -1;">
        <label for="pDesc">Descripción Corta</label>
        <textarea id="pDesc" placeholder="Breve historia del proyecto..."></textarea>
      </div>

      <button type="submit" class="btn-submit">GUARDAR CARTUCHO</button>
    </form>
  </section>

  <main>
    <div class="projects-grid" id="projectsContainer">
      </div>
  </main>

  <script>
    const DEFAULT_PROJECTS = [
      {
        id: 1,
        title: "Sonificador Galáctico",
        url: "https://ejemplo.com/sonificador",
        img: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=800&q=80",
        desc: "Sintetizador web que transforma capturas del espacio profundo a frecuencias de órgano retro.",
        tag: "Web Audio"
      },
      {
        id: 2,
        title: "Planetario 3D 8-Bit",
        url: "https://ejemplo.com/planetas",
        img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=800&q=80",
        desc: "Explorador orbital tridimensional con física gravitacional y visuales computarizados.",
        tag: "WebGL"
      }
    ];

    let projects = JSON.parse(localStorage.getItem('martin_portfolio_projects')) || DEFAULT_PROJECTS;

    const projectsContainer = document.getElementById('projectsContainer');
    const adminToggle = document.getElementById('adminToggle');
    const adminPanel = document.getElementById('adminPanel');
    const projectForm = document.getElementById('projectForm');

    let isAdmin = false;

    function renderProjects() {
      projectsContainer.innerHTML = '';

      if (projects.length === 0) {
        projectsContainer.innerHTML = `
          <div class="empty-state">
            <p>NO HAY PROYECTOS INSERTADOS.</p>
            <small>ABRE EL GESTOR PARA INSERTAR UN CARTUCHO.</small>
          </div>
        `;
        return;
      }

      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-window';
        
        card.innerHTML = `
          <div class="window-header">
            <div class="window-dots">
              <div class="dot red"></div>
              <div class="dot yellow"></div>
              <div class="dot green"></div>
            </div>
            <span class="window-title">READY - ROM</span>
          </div>

          <button class="delete-btn" onclick="deleteProject(${p.id})">BORRAR</button>

          <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="project-link">
            <div class="image-container">
              <img src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400/181425/ffcc00?text=NO+SIGNAL'">
            </div>
            <div class="project-body">
              <h3>${p.title}</h3>
              <p>${p.desc || 'Presiona botón para explorar el sistema.'}</p>
              ${p.tag ? `<span class="tag-badge">[${p.tag}]</span>` : ''}
            </div>
          </a>
        `;

        projectsContainer.appendChild(card);
      });
    }

    function toggleAdmin() {
      isAdmin = !isAdmin;
      adminPanel.classList.toggle('active', isAdmin);
      document.body.classList.toggle('admin-mode', isAdmin);
      adminToggle.textContent = isAdmin ? '[✕] CERRAR' : '[⚙] MODO GESTOR';
    }

    adminToggle.addEventListener('click', toggleAdmin);

    window.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === 'a' || e.key === 'A')) {
        toggleAdmin();
      }
    });

    projectForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const newProject = {
        id: Date.now(),
        title: document.getElementById('pTitle').value.trim(),
        url: document.getElementById('pLink').value.trim(),
        img: document.getElementById('pImg').value.trim(),
        tag: document.getElementById('pTag').value.trim(),
        desc: document.getElementById('pDesc').value.trim()
      };

      projects.unshift(newProject);
      localStorage.setItem('martin_portfolio_projects', JSON.stringify(projects));

      renderProjects();
      projectForm.reset();
    });

    window.deleteProject = function(id) {
      if (confirm('¿BORRAR ESTE CARTUCHO?')) {
        projects = projects.filter(p => p.id !== id);
        localStorage.setItem('martin_portfolio_projects', JSON.stringify(projects));
        renderProjects();
      }
    };

    renderProjects();
  </script>
</body>
</html>
